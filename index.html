<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legenda Automática (no navegador)</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --text:#1c1b19; --muted:#6b6a65; --accent:#d9480f; --line:#e3e1db; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161513; --card:#201f1c; --text:#f1efe9; --muted:#9b9992; --accent:#ff8a4c; --line:#34322d; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:760px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:1.7rem; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; }
  #drop { display:block; border:2px dashed var(--line); border-radius:12px; padding:40px 16px; text-align:center;
          cursor:pointer; color:var(--muted); transition:.15s; }
  #drop.over, #drop:hover { border-color:var(--accent); color:var(--accent); }
  input[type=file] { display:none; }
  .hidden { display:none !important; }
  video { width:100%; border-radius:10px; background:#000; }
  .bar { height:8px; background:var(--line); border-radius:99px; overflow:hidden; margin:12px 0 6px; }
  .bar > div { height:100%; width:0; background:var(--accent); transition:width .3s; }
  .badge { display:inline-block; background:var(--accent); color:#fff; border-radius:99px;
           padding:3px 12px; font-size:.85rem; font-weight:600; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; align-items:center; }
  button, select { font:inherit; background:var(--card); color:var(--text); border:1px solid var(--line);
           padding:9px 14px; border-radius:10px; }
  button { cursor:pointer; }
  button:hover { border-color:var(--accent); }
  .opts { margin-bottom:14px; color:var(--muted); font-size:.9rem; }
  small { color:var(--muted); display:block; margin-top:14px; }
  #err { color:#c92a2a; margin-top:12px; }
</style>
</head>
<body>
<main>
  <h1>Legenda Automática</h1>
  <p class="sub">Tudo roda no seu navegador. O vídeo não é enviado a nenhum servidor.</p>

  <div class="card">
    <div class="opts" id="opts">
      Modelo:
      <select id="model">
        <option value="tiny">Rápido (~40 MB)</option>
        <option value="base" selected>Equilibrado (~75 MB)</option>
        <option value="small">Preciso (~250 MB)</option>
      </select>
    </div>

    <label id="drop" for="file">
      <strong>Toque para escolher um vídeo</strong><br>ou arraste o arquivo aqui
    </label>
    <input id="file" type="file" accept="video/*,audio/*">

    <div id="status" class="hidden">
      <div id="statusText"></div>
      <div class="bar"><div id="fill"></div></div>
    </div>

    <div id="result" class="hidden">
      <video id="player" controls playsinline></video>
      <div class="row"><span>Idioma detectado:</span><span class="badge" id="lang"></span></div>
      <div class="row">
        <button id="dlSrt">Baixar .srt</button>
        <button id="dlVtt">Baixar .vtt</button>
        <button id="again">Novo vídeo</button>
      </div>
    </div>
    <div id="err"></div>
    <small>Na primeira vez o modelo é baixado e fica salvo no aparelho. Mantenha a tela ligada durante o processo.</small>
  </div>
</main>

<script type="module">
import { pipeline, env } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1";

env.allowLocalModels = false;

const $ = id => document.getElementById(id);
const LANGS = "en zh de es ru ko fr ja pt tr pl ca nl ar sv it id hi fi vi he uk el ms cs ro da hu ta no th ur hr bg lt la mi ml cy sk te fa lv bn sr az sl kn et mk br eu is hy ne mn bs kk sq sw gl mr pa si km sn yo so af oc ka be tg sd gu am yi lo uz fo ht ps tk nn mt sa lb my bo tl mg as tt haw ln ha ba jw su".split(" ");
const SOT = 50258, FIRST_LANG = 50259;

let pipes = {};       // cache de modelos já carregados
let current = null;

const langName = c => { try { return new Intl.DisplayNames(["pt-BR"], { type: "language" }).of(c); } catch { return c; } };
const setStatus = (t, p) => { $("statusText").textContent = t; $("fill").style.width = Math.round(p * 100) + "%"; };

async function loadPipe(size) {
  if (pipes[size]) return pipes[size];
  const progress_callback = e => {
    if (e.status === "progress" && e.total) setStatus(`Baixando modelo… ${Math.round(e.progress)}%`, (e.loaded / e.total) * 0.3);
  };
  pipes[size] = await pipeline("automatic-speech-recognition", `Xenova/whisper-${size}`,
    { device: "wasm", dtype: "q8", progress_callback });
  return pipes[size];
}

async function decodeAudio(file) {
  const buf = await file.arrayBuffer();
  const ctx = new AudioContext({ sampleRate: 16000 });
  const audio = await ctx.decodeAudioData(buf);
  await ctx.close();
  const n = audio.numberOfChannels, len = audio.length, out = new Float32Array(len);
  for (let c = 0; c < n; c++) { const d = audio.getChannelData(c); for (let i = 0; i < len; i++) out[i] += d[i] / n; }
  return out;
}

// Detecta o idioma olhando as probabilidades do primeiro passo do decodificador.
async function detectLanguage(pipe, audio) {
  try {
    const inputs = await pipe.processor(audio.subarray(0, 30 * 16000));
    const ids = new BigInt64Array([BigInt(SOT)]);
    const decoder_input_ids = new inputs.input_features.constructor("int64", ids, [1, 1]);
    const out = await pipe.model({ ...inputs, decoder_input_ids });
    const data = out.logits.data, vocab = out.logits.dims[2];
    let best = 0, bestV = -Infinity, sum = 0, exps = [];
    for (let i = 0; i < LANGS.length; i++) { const v = data[FIRST_LANG + i]; exps.push(v); if (v > bestV) { bestV = v; best = i; } }
    for (const v of exps) sum += Math.exp(v - bestV);
    return { code: LANGS[best], prob: 1 / sum };
  } catch (e) { console.warn("Falha na detecção de idioma", e); return null; }
}

const ts = (t, sep) => {
  let ms = Math.round(t * 1000);
  const h = Math.floor(ms / 3600000); ms %= 3600000;
  const m = Math.floor(ms / 60000); ms %= 60000;
  const s = Math.floor(ms / 1000); ms %= 1000;
  const p = (n, l = 2) => String(n).padStart(l, "0");
  return `${p(h)}:${p(m)}:${p(s)}${sep}${p(ms, 3)}`;
};

function buildCues(chunks, duration) {
  const cues = chunks.map((c, i) => {
    const start = c.timestamp[0] ?? 0;
    const end = c.timestamp[1] ?? Math.min(start + 4, duration);
    return { start, end: Math.max(end, start + 0.5), text: c.text.trim() };
  }).filter(c => c.text);
  let vtt = "WEBVTT\n\n", srt = "";
  cues.forEach((c, i) => {
    vtt += `${ts(c.start, ".")} --> ${ts(c.end, ".")}\n${c.text}\n\n`;
    srt += `${i + 1}\n${ts(c.start, ",")} --> ${ts(c.end, ",")}\n${c.text}\n\n`;
  });
  return { vtt, srt };
}

function fail(msg) {
  $("status").classList.add("hidden");
  $("drop").classList.remove("hidden");
  $("opts").classList.remove("hidden");
  $("err").textContent = msg;
}

async function handle(file) {
  if (!file) return;
  $("err").textContent = "";
  $("drop").classList.add("hidden");
  $("opts").classList.add("hidden");
  $("status").classList.remove("hidden");
  let stage = "carregar modelo";
  try {
    const size = $("model").value;
    setStatus("Carregando modelo…", 0);
    let pipe = await loadPipe(size);

    stage = "ler áudio do vídeo";
    setStatus("Extraindo áudio do vídeo…", 0.3);
    let audio;
    try { audio = await decodeAudio(file); }
    catch { throw new Error("Não foi possível ler o áudio deste arquivo. Tente um MP4 menor."); }
    const duration = audio.length / 16000;

    stage = "detectar idioma";
    setStatus("Detectando idioma…", 0.35);
    const det = await detectLanguage(pipe, audio);
    if (!det) { // a sessão pode ter ficado inválida: recarrega o modelo do cache
      delete pipes[size];
      pipe = await loadPipe(size);
    }
    stage = "gerar legenda";

    const totalChunks = Math.max(1, Math.ceil(duration / 25));
    let done = 0;
    setStatus("Gerando legenda…", 0.4);
    const result = await pipe(audio, {
      task: "transcribe",
      language: det ? det.code : undefined,
      chunk_length_s: 30,
      stride_length_s: 5,
      return_timestamps: true,
      chunk_callback: () => { done++; setStatus("Gerando legenda…", 0.4 + 0.6 * Math.min(done / totalChunks, 1)); },
    });

    const { vtt, srt } = buildCues(result.chunks || [{ text: result.text, timestamp: [0, duration] }], duration);
    const videoUrl = URL.createObjectURL(file);
    current = { videoUrl, vtt, srt, name: file.name.replace(/\.[^.]+$/, "") };

    const player = $("player");
    player.innerHTML = "";
    player.src = videoUrl;
    const track = document.createElement("track");
    track.kind = "subtitles";
    track.default = true;
    if (det) { track.srclang = det.code; track.label = langName(det.code); }
    else { track.srclang = "und"; track.label = "Legenda"; }
    track.src = URL.createObjectURL(new Blob([vtt], { type: "text/vtt" }));
    player.appendChild(track);
    player.addEventListener("loadedmetadata", () => { if (player.textTracks[0]) player.textTracks[0].mode = "showing"; }, { once: true });

    $("lang").textContent = det ? `${langName(det.code)} (${Math.round(det.prob * 100)}%)` : "automático";
    $("status").classList.add("hidden");
    $("result").classList.remove("hidden");
  } catch (e) {
    console.error(e);
    fail(`Erro ao ${stage}: ${e.message || e}`);
  }
}

function download(content, ext, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = `${current.name}.${ext}`;
  a.click();
}

$("file").onchange = e => handle(e.target.files[0]);
$("dlSrt").onclick = () => download(current.srt, "srt", "application/x-subrip");
$("dlVtt").onclick = () => download(current.vtt, "vtt", "text/vtt");
$("again").onclick = () => {
  URL.revokeObjectURL(current.videoUrl); current = null;
  $("result").classList.add("hidden"); $("drop").classList.remove("hidden");
  $("opts").classList.remove("hidden"); $("file").value = "";
};

const drop = $("drop");
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => { e.preventDefault(); handle(e.dataTransfer.files[0]); });
</script>
</body>
</html>
